<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>徽派高低墙 · 线框</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #111; }
    html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    main { position: relative; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .controls { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0; padding: 0 24px;
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; }
    .controls span { color: #606060; user-select: none; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #ddd; border-radius: 20px; background: #fff; color: #111; cursor: pointer; }
    button:hover { background: #f4f4f4; }
    button:focus-visible { outline: 2px solid #444; outline-offset: 3px; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: #545454; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
  <script type="importmap">{"imports":{"three":"./package/build/three.module.js"}}</script>
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <main aria-label="徽派高低墙 3D 线框">
    <canvas tabindex="0" aria-label="3D 模型。拖动、双指滑动或使用方向键旋转"></canvas>
    <div id="status" role="status">正在读取线框</div>
    <div class="controls" hidden>
      <span>拖动或双指滑动旋转 · 捏合缩放</span>
      <button type="button">重置视角</button>
    </div>
  </main>
</body>
</html>
