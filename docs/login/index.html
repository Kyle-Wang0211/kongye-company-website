<!doctype html>
<html lang="zh-CN"><head><script id="pw-existing-signin-entry">
(() => {
  const query = new URLSearchParams(location.search);
  if (query.get('method') === 'qr' || query.has('callback') || query.has('native-link')) return;
  const target = new URL('/community/', location.origin);
  for (const [key, value] of query) target.searchParams.append(key, value);
  target.searchParams.delete('method');
  target.searchParams.set('auth', 'signin');
  target.searchParams.set('legacy_auth', '1');
  document.documentElement.style.visibility = 'hidden';
  location.replace(target.href);
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>窗后城 · 登录</title><link rel="stylesheet" href="login.css"><script src="/vendor/supabase/supabase-2.112.0.js" defer></script><script src="vendor/qrcode-generator-1.4.4.js" defer></script><script type="module" src="login.mjs?qr=20261115"></script></head>
<body><header><a href="/" data-i18n="brand">窗后城</a><button id="language" type="button">EN</button></header><main>

<nav aria-label="登录方式"><button type="button" class="selected" data-method="password" data-i18n="passwordTab">密码登录</button><button type="button" data-method="code" data-i18n="codeTab">验证码登录</button><button type="button" data-method="qr" data-i18n="qrTab">扫码登录</button></nav>
<div class="columns"><section id="credentials"><form id="login-form">
<label for="account" data-i18n="account">邮箱或手机号</label><input id="account" name="username" autocomplete="username" required maxlength="254" placeholder="name@example.com / +86 138…">
<div id="password-fields"><label for="password" data-i18n="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password"></div>

<p id="status" role="status" aria-live="polite"></p><p class="muted small"><a href="/privacy.html" data-i18n="privacy">隐私政策</a> · <a href="/terms.html" data-i18n="terms">用户协议</a></p></main></body></html>
