<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动管理 · 窗后城</title><link rel="stylesheet" href="styles.css?v=monochrome-20261106-v46"><link rel="stylesheet" href="community-account-menu.css?v=account-library-20261106-v44"><link rel="stylesheet" href="activity-admin.css?v=activities-20261110"><script defer src="vendor/supabase/supabase-2.112.0.js"></script><script type="module" src="activity-admin.mjs?v=activities-20261110"></script></head>
<body><header class="site-header wrap"><a class="brand" href="./">窗后城</a><a href="community/?auth=signin">登录或切换账号</a><nav id="account-nav" aria-label="账号" aria-busy="true"><details id="account-menu"><summary id="account-summary" class="community-account"><span class="account-avatar-pending"></span><span>账号</span></summary><div id="account-actions"></div></details></nav></header>
<main class="activity-admin wrap"><h1>活动管理</h1><p>草稿保存后可预览，发布后会同时更新社区的活动标题、封面与详情。下线后活动从公开页面移除。</p><p id="activity-status" role="status" aria-live="polite">正在检查账号与管理权限…</p><div class="activity-admin-layout"><aside><button id="activity-reload" type="button">刷新列表</button><button id="activity-new" type="button" disabled>新建活动</button><div id="activity-list"></div></aside>
<form id="activity-form" hidden><fieldset id="activity-fields"><label>活动标识<input name="slug" required maxlength="80" pattern="[a-z0-9][a-z0-9-]*"><small>用于活动地址，保存后保留此标识。</small></label><label>标题<input name="title" required maxlength="120"></label><label>封面图片<input name="cover" type="url" required><input id="activity-cover-file" type="file" accept="image/jpeg,image/png,image/webp"><small>上传 JPG、PNG 或 WebP，最大 8 MiB。</small></label><img id="activity-cover-preview" alt="封面预览" hidden><label>排序<input name="sort_order" type="number" min="0" max="10000" step="1" required></label><label>页面样式<select name="template_key"><option value="article">图文活动</option><option value="ceramic">瓷影活动</option><option value="resort">山庄导览</option></select><small>已有专用页面保留其样式。新活动使用图文样式。</small></label><section><h2>活动详情</h2><div id="activity-detail-fields"></div><button id="activity-add-section" type="button">添加段落</button></section><div class="activity-admin-actions"><button type="submit">保存草稿</button><button id="activity-preview" type="button">预览当前内容</button><button id="activity-publish" type="button">发布已保存草稿</button><button id="activity-withdraw" type="button">下线活动</button></div></fieldset></form></div></main>
</body></html>
