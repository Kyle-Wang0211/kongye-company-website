<!doctype html>
<html lang="zh-CN" class="community-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/" target="_top">
  <title>精选屏幕 · 窗后城</title>
<link rel="stylesheet" href="styles.css?v=monochrome-20261106-v46">
<link rel="stylesheet" href="community-screens.css?v=resort-guide-20261106-v45">
<script src="community-screens.mjs?v=account-library-20261106-v44" type="module"></script>
  <script type="module">
    import {initSiteLocale} from './site-l10n.mjs?v=account-library-20261106-v44';
    import {installMiniProgramNavigation} from './miniprogram-navigation.mjs?v=featured-20261107';
    installMiniProgramNavigation();
    await initSiteLocale();
    const reportHeight = () => parent.postMessage({
      protocol: 'PW_FEATURED_SCREENS_V1', height: document.body.offsetHeight,
    }, location.origin);
    new ResizeObserver(reportHeight).observe(document.body);
    reportHeight();
  </script>
</head>
<body>
<div class="community-screen-overflow">
    <section id="top" class="community-screen-section wrap" aria-label="精选屏幕" data-i18n-aria="siteScreenStage">
      <div class="community-screen-stage">
        <a class="community-feature-screen community-screen-event" data-position="left" href="screen.html?screen=1" aria-label="瓷影 · 古瓷文物展"><img src="assets/events/porcelain-ink.png" width="1536" height="1024" alt="瓷影 · 古瓷文物展，水墨瓷器与庭院"></a>
        <a class="community-feature-screen community-screen-event" data-position="center" href="screen.html?screen=2" aria-label="屏幕 2 · 水墨山水"><img src="assets/events/landscape-ink.png" width="1536" height="1024" alt="水墨山水"></a>
        <a class="community-feature-screen community-screen-event" data-position="right" href="screen.html?screen=3" aria-label="屏幕 3 · 水墨庭院"><img src="assets/events/courtyard-ink.png" width="1536" height="1024" alt="水墨庭院"></a>
      </div>
      <nav class="community-screen-switcher" aria-label="切换屏幕" data-i18n-aria="siteScreenSelection">
        <button class="community-screen-choice" type="button" aria-label="屏幕 01" aria-pressed="false"><span class="community-screen-dot" aria-hidden="true"></span></button>
        <button class="community-screen-choice" type="button" aria-label="屏幕 02" aria-pressed="true"><span class="community-screen-dot" aria-hidden="true"></span></button>
        <button class="community-screen-choice" type="button" aria-label="屏幕 03" aria-pressed="false"><span class="community-screen-dot" aria-hidden="true"></span></button>
      </nav>
    </section>
    </div>
</body>
</html>
