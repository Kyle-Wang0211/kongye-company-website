    #status:empty { display:none; }

<body>
  <canvas id="viewer" aria-label="3D作品"></canvas>
  <div id="status" role="status" aria-live="polite">正在初始化…</div>
  <script type="module">
    import { create } from './viewer.mjs?v=production-viewer-parity-20261102-v5';
    import { installHostBridge } from './host_bridge.mjs?v=production-viewer-parity-20261102-v5';
    import { verifyLocalBundle } from './bundle_identity.mjs';
    const canvas = document.querySelector('#viewer');
    const status = document.querySelector('#status');
    let resizeObserver;
    const uiKeys = ['title', 'canvasLabel', 'initializing', 'loading', 'failure', 'skpNotice'];
    let uiStrings = {
      title: 'PocketWorld Shared Viewer', canvasLabel: '3D作品', initializing: '正在初始化…',
      loading: '正在加载…', failure: '暂时无法显示作品，请重试。',
      skpNotice: 'SKP 转换预览：复杂结构可能存在差异',
    };
    let lastState = { status: 'initializing' };
    function renderUi() {
      document.title = uiStrings.title;
      canvas.setAttribute('aria-label', uiStrings.canvasLabel);
      status.textContent = lastState.error || lastState.status === 'error' ? uiStrings.failure :
        lastState.status === 'initializing' ? uiStrings.initializing :
        lastState.status === 'loading' ? uiStrings.loading :
        lastState.format === 'skp' ? uiStrings.skpNotice : '';
    }
    function onUiLocalization(event) {
      if (event.origin !== window.location.origin ||
          (event.source !== window.parent && event.source !== window)) return;
      if (event.data?.type !== 'pw-viewer-ui-localization') return;
      const strings = event.data.strings;
      if (!strings || typeof strings !== 'object' || !['zh', 'en'].includes(strings.locale)) return;
      const updates = {};
      for (const key of uiKeys) {
        if (typeof strings[key] === 'string' && strings[key].length > 0 && strings[key].length <= 2048) {
          updates[key] = strings[key];
        }
      }
      uiStrings = { ...uiStrings, ...updates };
      document.documentElement.lang = strings.locale;
      renderUi();
    }
    window.addEventListener('message', onUiLocalization);
    const localizationReady = { protocol: 'PW_SHARED_VIEWER_V1', type: 'pw-viewer-ui-localization-ready' };
    if (window.PWSharedHost?.postMessage) window.PWSharedHost.postMessage(JSON.stringify(localizationReady));
    else if (window.parent !== window && window.location.origin !== 'null') {
      window.parent.postMessage(localizationReady, window.location.origin);
    }
    function stateChanged(state) {
      lastState = state;
      renderUi();
      window.dispatchEvent(new CustomEvent('pw-viewer-state', { detail: state }));
    }
    window.pwSharedViewerReady = verifyLocalBundle().then(bundleIdentity =>
      create(canvas, { onStateChange: stateChanged, bundleIdentity,
        onSurfaceEvent: (type, detail) => window.dispatchEvent(new CustomEvent(type, {detail})) })).then(async controller => {
      window.pwSharedViewerController = controller;
      const resize = () => {
        if (!controller.getState().disposed) controller.resize();
      };
      if (typeof ResizeObserver !== 'undefined') {
        resizeObserver = new ResizeObserver(resize);
        resizeObserver.observe(canvas);
      } else window.addEventListener('resize', resize);
      const visibility = () => {
        if (controller.getState().disposed) return;
        document.hidden ? controller.pause() : controller.resume();
      };
      document.addEventListener('visibilitychange', visibility);
      window.addEventListener('pageshow', event => {
        if (event.persisted && !controller.getState().disposed) controller.resume();
      });
      window.addEventListener('pagehide', event => {
        if (event.persisted) {
          if (!controller.getState().disposed) controller.pause();
          return;
        }
        window.removeEventListener('message', onUiLocalization);
        resizeObserver?.disconnect();
        window.removeEventListener('resize', resize);
        document.removeEventListener('visibilitychange', visibility);
        controller.dispose();
      });
      const query = new URLSearchParams(location.search);
      if (query.has('model')) await controller.load({ url: query.get('model'), format: query.get('format') || 'glb' });
      return controller;
    });
    window.pwSharedViewerReady.catch(error => {
      const diagnostic = error instanceof Error ? error.message : String(error);
      lastState = { status: 'error', error: diagnostic };
      renderUi();
      window.dispatchEvent(new CustomEvent('pw-viewer-error', { detail: diagnostic }));
    });
    installHostBridge(window);
  </script>
</body>
