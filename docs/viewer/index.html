    let lastState = { status: 'initializing' };

      document.title = uiStrings.title;

    }
    const download = document.querySelector('#download');
    const downloadValue = document.querySelector('#download-value');
    const downloadNumber = document.querySelector('#download-number');
    let downloading = true;

      const ratio = totalBytes > 0 ? Math.min(1, Math.max(0, receivedBytes / totalBytes)) : null;
      download.hidden = false;
      downloading = true;
      download.classList.toggle('indeterminate', ratio === null);
