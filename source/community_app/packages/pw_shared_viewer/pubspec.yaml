name: pw_shared_viewer
description: Offline shared upstream Three.js host. No production route replacement.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  crypto: 3.0.7
  flutter:
    sdk: flutter
  web: 1.1.1
  webview_flutter: 4.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  assets:
    - web/BUNDLE_MANIFEST.json
    - web/vendor/three/LICENSE
    - web/vendor/three/package.json
    - web/index.html
    - web/surface_comments.mjs
    - web/SURFACE_COMMENTS_NOTICE
    - web/SURFACE_COMMENTS_LICENSE
    - web/viewer.mjs
    - web/model_framing.mjs
    - web/MODEL_FRAMING_UPSTREAM.json
    - web/MODEL_FRAMING_LICENSE
    - web/MODEL_FRAMING_NOTICE
    - web/image_loader_lifecycle.mjs
    - web/host_bridge.mjs
    - web/bundle_identity.mjs
    - web/skp_import.mjs
    - web/skp_import_worker.mjs
    - web/skp_policy.mjs
    - web/vendor/openskp/
    - web/vendor/three/build/
    - web/vendor/three/examples/jsm/utils/
    - web/vendor/three/examples/jsm/controls/
    - web/vendor/three/examples/jsm/loaders/
